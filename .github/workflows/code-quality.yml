name: Code Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          #开启 pip 缓存，加速后续构建（耗时从 45s 降到几秒）
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q clothing_assistant tests

      - name: Ruff lint
        run: ruff check clothing_assistant tests

      - name: Docstring coverage
        run: interrogate -v -i --fail-under=30 clothing_assistant

      - name: Unit tests
        run: python -m pytest -q
